name: Check Constant-Time Security
permissions:
  contents: read
on:
  workflow_call:
  workflow_dispatch:

env:
  NIXPKGS_ALLOW_UNFREE: 1
  
jobs:
  checkCT:
    name: CT
    runs-on: ${{ github.ref_name == 'refactor_bindings_ci_self' && 'selfrice' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        size: [ '768', '1024' ]
        dir: [ 'avx2' ]
        target: [ 'ct', 'sct' ]
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - run: nix-shell --arg full false --run "echo Dependencies OK…"
    - run: nix-shell --arg full false --run "make -C code/jasmin/${{matrix.size}}/${{matrix.dir}}/ ${{matrix.target}}"
